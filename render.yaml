services:
  - type: web
    name: laneline
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-6.1-sol
      - key: APP_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
