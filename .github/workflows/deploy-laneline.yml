name: Deploy LaneLine

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily LaneLine swimmer refresh', 'Daily Western Zone refresh']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: laneline-pages
  cancel-in-progress: false

jobs:
  deploy:
    # A private repository must not silently publish its swimmer data on Pages.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Package public files only
        run: |
          mkdir -p _site/western-zone-dashboard/data
          cp index.html datahub-history.json swimmer-roster.json time-standards.json standards-engine.js insights-engine.js rankings-engine.js relay-engine.js rankings-dashboard.js rankings-worker.js performance.css motion.js swimmer-ui.js upcoming-meets.js _site/
          node -e "const fs=require('fs');fs.writeFileSync('_site/rankings-dashboard.html',require('./rankings-dashboard').shell(fs.readFileSync('western-zone-dashboard/index.html','utf8')))"
          if test -f datahub-refresh-status.json; then cp datahub-refresh-status.json _site/; fi
          cp western-zone-dashboard/index.html _site/western-zone-dashboard/
          cp -R western-zone-dashboard/data/. _site/western-zone-dashboard/data/
          mkdir -p _site/ui-media
          cp -R ui-media/. _site/ui-media/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
